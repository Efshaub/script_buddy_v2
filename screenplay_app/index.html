<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenplay Writer - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signin-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 50px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #6e6e73;
            margin-bottom: 40px;
        }

        .google-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 500;
            color: #1d1d1f;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            transition: all 0.2s;
        }

        .google-btn:hover {
            background: #f8f8f8;
            border-color: #d0d0d0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .demo-btn {
            background: transparent;
            border: none;
            color: #667eea;
            font-size: 14px;
            margin-top: 20px;
            cursor: pointer;
            text-decoration: underline;
        }

        .demo-btn:hover {
            color: #764ba2;
        }

        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            text-align: left;
            color: #6e6e73;
            font-size: 14px;
        }

        .feature-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="signin-container">
        <div class="logo">🎬</div>
        <h1>Screenplay Writer</h1>
        <p class="subtitle">Professional screenplay writing made simple</p>

        <button class="google-btn" onclick="signInWithGoogle()">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign in with Google
        </button>

        <button class="demo-btn" onclick="signInDemo()">
            Continue without signing in (demo mode)
        </button>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">✨</span>
                <span>AI-powered screenplay generation</span>
            </div>
            <div class="feature">
                <span class="feature-icon">💾</span>
                <span>Auto-save your projects</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🎨</span>
                <span>Light & dark mode support</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📱</span>
                <span>Works on all devices</span>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // Check if user is already signed in
        if (localStorage.getItem('user')) {
            window.location.href = 'projects.html';
        }

        // Google Sign In
        function signInWithGoogle() {
            // Initialize Google Sign-In
            google.accounts.id.initialize({
                client_id: 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com',
                callback: handleCredentialResponse
            });

            // Prompt the user
            google.accounts.id.prompt();
        }

        function handleCredentialResponse(response) {
            // Decode the credential response
            const responsePayload = parseJwt(response.credential);

            const user = {
                id: responsePayload.sub,
                name: responsePayload.name,
                email: responsePayload.email,
                picture: responsePayload.picture
            };

            // Save user to localStorage
            localStorage.setItem('user', JSON.stringify(user));

            // Redirect to projects page
            window.location.href = 'projects.html';
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }

        // Demo mode (no authentication required)
        function signInDemo() {
            const demoUser = {
                id: 'demo',
                name: 'Demo User',
                email: 'demo@screenplaywriter.com',
                picture: '👤',
                isDemo: true
            };

            localStorage.setItem('user', JSON.stringify(demoUser));
            window.location.href = 'projects.html';
        }
    </script>
</body>
</html>
